# Render blueprint — deploy via https://render.com (New > Blueprint, point at this repo).
# After the first deploy, set the secret env vars (sync:false) in the dashboard.
# The app boots without them; only /search needs a Google key and billing needs Stripe.
#
# NOTE: the free plan uses an ephemeral filesystem, so the SQLite DB resets on
# each deploy/restart — fine for testing features. For persistence, switch
# DATABASE_URL to a managed Postgres connection string.
services:
  - type: web
    name: locallead
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_AGENCY
        sync: false
